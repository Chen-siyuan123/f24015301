<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>愤怒的小鸟 · 弹弓大作战</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23e63946'/><circle cx='24' cy='26' r='8' fill='%23fff'/><circle cx='24' cy='26' r='3.5' fill='%23111'/><path d='M46 30 L58 36 L46 42 Z' fill='%23ffc93c'/></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="btn-menu" class="icon-btn" aria-label="菜单">
      <span class="bars"><i></i><i></i><i></i></span>
    </button>
    <div class="level-info">
      <strong id="level-name">第 1 关</strong>
      <small id="level-sub">翠绿山谷</small>
    </div>
  </div>
  <div class="hud-center">
    <div id="birds-left" class="birds-left"></div>
  </div>
  <div class="hud-right">
    <div class="score-box">
      <span>得分</span>
      <strong id="score">0</strong>
    </div>
    <button id="btn-sound" class="icon-btn" aria-label="音效开关">♪</button>
  </div>
</div>

<div id="tip">拖动小鸟瞄准 · 松手发射 · 飞行中点击屏幕触发技能</div>

<div id="screen-start" class="overlay">
  <div class="start-card">
    <div class="logo">
      <svg viewBox="0 0 120 120" width="104" height="104" aria-hidden="true">
        <circle cx="58" cy="62" r="44" fill="#e63946"/>
        <path d="M22 56 Q18 34 40 30 Q58 22 74 30 Q96 34 94 56 Q92 78 74 92 Q58 104 42 92 Q26 80 22 56 Z" fill="#e63946"/>
        <ellipse cx="58" cy="92" rx="26" ry="14" fill="#f4a8a8"/>
        <circle cx="44" cy="52" r="12" fill="#fff"/>
        <circle cx="44" cy="53" r="5.5" fill="#20242b"/>
        <circle cx="46" cy="51" r="1.8" fill="#fff"/>
        <path d="M30 40 L50 44" stroke="#20242b" stroke-width="4" stroke-linecap="round"/>
        <path d="M92 58 L112 68 L92 76 Z" fill="#ffc93c"/>
        <path d="M24 40 Q10 30 16 46 Q8 46 14 58" fill="none" stroke="#b5232f" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>愤怒的小鸟</h1>
    <p class="tagline">弹弓大作战 · 消灭所有捣蛋猪</p>
    <div class="start-actions">
      <button id="btn-start" class="btn primary big">开始游戏</button>
      <button id="btn-levels-open" class="btn ghost">关卡选择</button>
      <button id="btn-leaderboard-open" class="btn ghost">排行榜</button>
    </div>
    <ul class="howto">
      <li><b>拖动</b>弹弓上的小鸟蓄力瞄准，松手发射</li>
      <li>飞行中<b>点击屏幕</b>触发小鸟技能</li>
      <li>黄鸟加速 · 蓝鸟分裂 · 黑鸟爆炸 · 红鸟硬撞</li>
    </ul>
    <p class="footer-note">Flask + Matter.js · 可部署到腾讯云 CloudBase</p>
  </div>
</div>

<div id="screen-levels" class="overlay hidden">
  <div class="panel-card">
    <div class="panel-head">
      <h2>选择关卡</h2>
      <button id="btn-levels-close" class="btn tiny">返回</button>
    </div>
    <div id="level-grid" class="level-grid"></div>
  </div>
</div>

<div id="screen-result" class="overlay hidden">
  <div class="result-card">
    <div id="result-badge" class="result-badge">关卡完成</div>
    <div id="result-stars" class="stars"></div>
    <div class="result-score"><span>本关得分</span><strong id="result-score">0</strong></div>
    <div id="result-extra" class="result-extra"></div>
    <div class="result-actions">
      <button id="btn-retry" class="btn ghost">重玩本关</button>
      <button id="btn-next" class="btn primary">下一关</button>
      <button id="btn-result-levels" class="btn ghost">关卡选择</button>
    </div>
    <div id="submit-area" class="submit-area">
      <input id="name-input" class="name-input" maxlength="12" placeholder="你的名字（最多 12 字）">
      <button id="btn-submit" class="btn primary small">提交到排行榜</button>
    </div>
    <p id="submit-hint" class="submit-hint"></p>
  </div>
</div>

<aside id="leaderboard" class="panel-card lb-card hidden">
  <div class="panel-head">
    <h2>排行榜</h2>
    <button id="btn-lb-close" class="btn tiny">关闭</button>
  </div>
  <ol id="lb-list" class="lb-list"></ol>
  <p class="lb-note">成绩由 Flask 接口 /api/score 提供</p>
</aside>

<div id="toast" class="toast"></div>

<script src="/vendor/matter.min.js"></script>
<script src="/js/levels.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/render.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
